# camtracker.py settings. Runs in Docker: see README.md.
# Comments go on their own line (configparser).
# Secrets come from the environment, not this file (the repo is public):
# CAMERA_URL, MQTT_USERNAME, MQTT_PASSWORD.

[camera]
# The camera's RTSP stream. The substream is plenty and cheap to decode;
# switch to the main stream if far-away people aren't detected. Frigate's
# restream works too: rtsp://<frigate-host>:8554/<camera-name>
# Leave blank and set CAMERA_URL instead when it holds a password.
url =
# Detections per second. 10-15 is smooth; the Coral manages far more.
detect_fps = 12
# The part of the picture to search, as fractions of the frame:
# x1, y1, x2, y2 (0,0 = top left). A strip over your side of the street
# skips the sky and your own yard. Check it with --snapshot.
roi = 0, 0, 1, 1
# Optional: search the far part again with smaller tiles, so people far
# away (small in the picture) are seen while roi covers everyone near.
# Same form as roi, e.g. far_roi = 0, 0.05, 1, 0.6 for a strip at the top.
# Each extra tile is another pass on the Coral per frame.
far_roi =
# Model passes across the ROI. auto = enough for roughly square tiles,
# so a wide strip is searched at full detail.
tiles = auto

[detector]
model = /models/ssdlite_mobiledet_coco_qat_postprocess_edgetpu.tflite
# auto = the first Edge TPU that isn't already in use (Frigate keeps its own).
# Or name one: usb:0, usb:1, pci:0
device = auto
# COCO class 0 = person
person_id = 0
min_score = 0.5
# Ignore boxes shorter than this fraction of the frame height.
min_height = 0.04
# Things the model takes for people but aren't (a ghost, a skeleton): one
# box per decoration, x1, y1, x2, y2 as fractions of the frame, separated by
# ";". Copy them from the "box" in --snapshot's output. Someone walking past
# a decoration is still seen; someone standing right in front of it may not be.
ignore =
# How closely a detection must match an ignore box (IoU, 0..1) to be dropped.
ignore_iou = 0.5

[mqtt]
host = 192.168.86.5
port = 1883
username =
password =
target_topic = house/tracking/target
command_topic = house/show/command
# Only track while the show is on (one command runs everything).
follow_command = true
start_enabled = false

[mapping]
# With the camera on the house between the eyes, a person's left/right in the
# picture is the angle the eyes should look. hfov_deg is the camera's
# horizontal field of view (from its spec sheet).
hfov_deg = 100
# The look angle, either side of straight out, that is a full look.
gaze_max_deg = 35
# Optional calibration, replaces the two lines above: u:x pairs, where u is a
# spot across the picture (0 = left edge, 1 = right edge, read it from
# --watch while someone stands there) and x is where the eye should look
# (-1 = audience's left ... +1 = audience's right). Example:
# points = 0.1:0.9, 0.5:0, 0.9:-0.9
points =
# Flip if the eyes look away from people.
invert_x = false
# Look down as a person comes closer (their feet lower in the picture):
# feet at y_far (fraction of frame height) = level, at y_near = fully down.
y_from_feet = false
y_far = 0.45
y_near = 0.95
# How the look goes down in between: 1 = evenly by feet height. Below 1
# (0.5 typical) moves the eyes more as someone starts up the driveway and
# less at the end; the fully-down spot (y_near) stays the same.
y_curve = 1.0

[tracking]
# 0..1 fraction toward each new position. Lower = calmer, higher = snappier.
smooth_factor = 0.5
publish_hz = 15
# Re-send the target this often while someone stands still.
heartbeat_s = 0.75
# Passed to the eye as each target's hold; match the eye's target_hold.
hold_s = 2.0
# Keep looking at a person through missed detections this long.
lost_after_s = 0.8
# A detection further than this (fraction of the frame width) from the
# person being followed is someone else.
max_jump = 0.25

[status]
# Running / tracking / stream / last person seen, in Home Assistant.
enabled = true
node = camera
base_topic = house/status
discovery_prefix = homeassistant
