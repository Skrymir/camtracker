<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camtracker</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #999; --bar: #1c1c1c;
          --btn: #2a2a2a; --btn-hi: #3a3a3a; --accent: #4a9eff; --err: #ff6b6b; --ok: #5c5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px;
           background: var(--bar); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  button { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid #444;
           border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--btn-hi); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .spacer { flex: 1; }
  #msg { color: var(--dim); min-height: 1.4em; padding: 6px 16px 0; }
  #msg.err { color: var(--err); } #msg.ok { color: var(--ok); }
  #stage { position: relative; line-height: 0; }
  #stage img { display: block; width: 100%; height: auto; background: #000; }
  #ed { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #ed .zone { fill: transparent; stroke-width: 2; cursor: move; }
  #ed .mask { fill: rgba(255, 0, 255, .15); stroke: #f0f; stroke-width: 2; cursor: pointer; }
  #ed .mask.sel { fill: rgba(255, 0, 255, .3); stroke-width: 3; }
  #ed .box { fill: none; stroke: #f0f; stroke-width: 1.5; stroke-dasharray: 5 4; }
  #ed .h { fill: #fff; stroke: #000; stroke-width: 1.5; cursor: grab; }
  #ed .mid { fill: rgba(255, 255, 255, .5); stroke: #000; stroke-width: 1; cursor: copy; }
  #ed .draft { fill: rgba(255, 0, 255, .1); stroke: #f0f; stroke-width: 2; stroke-dasharray: 6 4; }
  #ed.drawing { cursor: crosshair; }
  p { margin: 8px 16px; }
  .k { display: inline-block; width: .8em; height: .8em; margin: 0 4px 0 12px;
       border: 2px solid; vertical-align: -1px; }
  a { color: #9cf; }
  [hidden] { display: none !important; }
</style></head><body>
<header>
  <h1>camtracker</h1>
  <span id="view-tools">
    <button id="edit" hidden>Edit zones</button>
  </span>
  <span id="edit-tools" hidden>
    <button id="add-mask">Add mask</button>
    <button id="del-mask" disabled>Delete mask</button>
    <button id="far">Add far_roi</button>
    <button id="new-frame">New frame</button>
  </span>
  <span class="spacer"></span>
  <span id="save-tools" hidden>
    <button id="cancel">Cancel</button>
    <button id="save" class="primary">Save</button>
  </span>
</header>
<div id="msg" role="status"></div>
<div id="stage">
  <img id="live" src="stream.mjpg" alt="Live camera view">
  <img id="still" alt="Camera frame to edit on" hidden>
  <svg id="ed" hidden></svg>
</div>
<p id="legend"><span class="k" style="border-color:#0d0"></span>following
<span class="k" style="border-color:#f00"></span>person
<span class="k" style="border-color:#f80"></span>near miss
<span class="k" style="border-color:#f0f"></span>ignored / masks
<span class="k" style="border-color:#fc0"></span>roi
<span class="k" style="border-color:#0af"></span>tiles
<span class="k" style="border-color:#0ff"></span>far_roi tiles</p>
<p><a href="snapshot.jpg">Full-resolution frame</a></p>
<script>
"use strict";
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const live = $("live"), still = $("still"), ed = $("ed"), msg = $("msg");
const HINT = "Drag a box's corners (or the box) to resize/move it. Click a mask to select it, " +
  "drag its points; drag a midpoint to add one, double-click (double-tap) a point to remove it.";
const TOUCH = matchMedia("(pointer: coarse)").matches;   // bigger handles for fingers

let zones = null;        // as last loaded or saved
let z = null;            // being edited: {roi, far_roi, masks}
let sel = -1;            // selected mask
let draft = null;        // points of a mask being drawn
let drag = null;         // what the pointer is moving
let dirty = false;

function say(text, kind) { msg.textContent = text || ""; msg.className = kind || ""; }
const clamp = v => Math.min(1, Math.max(0, v));
const r3 = v => Math.round(v * 1000) / 1000;
const copy = o => JSON.parse(JSON.stringify(o));

async function loadZones() {
  const r = await fetch("zones.json", {cache: "no-store"});
  if (!r.ok) return;
  zones = await r.json();
  $("edit").hidden = !zones.editable;
}

// -- edit mode -------------------------------------------------------------
async function startEdit() {
  await loadZones();
  z = {roi: zones.roi.slice(), far_roi: zones.far_roi && zones.far_roi.slice(),
       masks: copy(zones.ignore_masks)};
  sel = -1; draft = null; dirty = false;
  live.removeAttribute("src");                     // stop the stream while editing
  live.hidden = true;
  $("view-tools").hidden = true; $("legend").hidden = true;
  $("edit-tools").hidden = false; $("save-tools").hidden = false;
  await newFrame();
  ed.removeAttribute("hidden");                   // an <svg>: no .hidden property
  say(HINT);
  render();
}

function newFrame() {
  say("Getting a frame from the camera…");
  return new Promise(done => {
    still.onload = () => { still.hidden = false; say(HINT); render(); done(); };
    still.onerror = () => {
      say("No picture from the camera yet: try New frame in a moment.", "err");
      still.hidden = false; done();
    };
    still.src = "frame.jpg?t=" + Date.now();
  });
}

function stopEdit() {
  z = null; draft = null; drag = null; dirty = false;
  ed.setAttribute("hidden", ""); still.hidden = true; still.removeAttribute("src");
  $("edit-tools").hidden = true; $("save-tools").hidden = true;
  $("view-tools").hidden = false; $("legend").hidden = false;
  live.src = "stream.mjpg?t=" + Date.now();
  live.hidden = false;
}

async function save() {
  if (draft) finishDraft();
  $("save").disabled = true;
  try {
    const r = await fetch("zones", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({roi: z.roi, far_roi: z.far_roi, ignore_masks: z.masks})});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { say("Not saved: " + (body.error || r.statusText), "err"); return; }
    zones = Object.assign(body, {editable: true});
    stopEdit();
    say("Saved to camtracker.ini and in use now (the old file is camtracker.ini.bak).", "ok");
  } catch (e) {
    say("Not saved: " + e, "err");
  } finally {
    $("save").disabled = false;
  }
}

// -- geometry --------------------------------------------------------------
function box() { return ed.getBoundingClientRect(); }
function toPx(x, y) { const b = box(); return [x * b.width, y * b.height]; }
function fromEvent(e) {
  const b = box();
  return [clamp((e.clientX - b.left) / b.width), clamp((e.clientY - b.top) / b.height)];
}
// a rectangle's corners, clockwise from top left, as [xi, yi] indexes into [x1, y1, x2, y2]
const CORNERS = [[0, 1], [2, 1], [2, 3], [0, 3]];

function tidyRect(r) {                                // x1 < x2, y1 < y2, at least 2% across
  let [x1, y1, x2, y2] = r;
  if (x1 > x2) [x1, x2] = [x2, x1];
  if (y1 > y2) [y1, y2] = [y2, y1];
  if (x2 - x1 < 0.02) x2 = Math.min(1, x1 + 0.02), x1 = x2 - 0.02;
  if (y2 - y1 < 0.02) y2 = Math.min(1, y1 + 0.02), y1 = y2 - 0.02;
  return [x1, y1, x2, y2].map(r3);
}

// -- drawing ---------------------------------------------------------------
function el(name, attrs, parent) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || ed).appendChild(e);
  return e;
}
function pts(list) { return list.map(p => toPx(p[0], p[1]).join(",")).join(" "); }
function handle(x, y, cls, start, r) {
  const [px, py] = toPx(x, y);
  const h = el("circle", {cx: px, cy: py, r: (r || 7) * (TOUCH ? 1.7 : 1), class: cls});
  h.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); begin(e, start); });
  return h;
}

function render() {
  if (!z) return;
  ed.textContent = "";
  ed.classList.toggle("drawing", !!draft);
  for (const b of zones.ignore || [])                // ignore boxes: shown, not edited
    el("polygon", {points: pts([[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]]), class: "box"});
  rect("roi", "#fc0");
  if (z.far_roi) rect("far_roi", "#0ff");
  z.masks.forEach((m, i) => {
    const poly = el("polygon", {points: pts(m), class: "mask" + (i === sel ? " sel" : "")});
    poly.addEventListener("pointerdown", e => {
      if (draft) return;
      e.stopPropagation();
      select(i);
      begin(e, {kind: "move-mask", i, from: fromEvent(e), orig: copy(m)});
    });
  });
  if (sel >= 0 && z.masks[sel]) {
    const m = z.masks[sel];
    m.forEach((p, j) => {                             // midpoints: drag to add a point
      const q = m[(j + 1) % m.length];
      handle((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, "mid", {kind: "insert", i: sel, j: j + 1}, 5);
    });
    m.forEach((p, j) => handle(p[0], p[1], "h", {kind: "point", i: sel, j}));
  }
  if (draft) {
    if (draft.length > 1) el("polygon", {points: pts(draft), class: "draft"});
    draft.forEach((p, j) => handle(p[0], p[1], "h", {kind: "draft", j}, j === 0 ? 9 : 6));
  }
  $("del-mask").disabled = sel < 0;
  $("far").textContent = z.far_roi ? "Remove far_roi" : "Add far_roi";
  $("add-mask").textContent = draft ? "Finish mask" : "Add mask";
}

function rect(key, colour) {
  const r = z[key];
  const shape = el("polygon", {points: pts(CORNERS.map(([a, b]) => [r[a], r[b]])),
                               class: "zone", stroke: colour});
  shape.addEventListener("pointerdown", e => {
    if (draft) return;
    e.stopPropagation();
    begin(e, {kind: "move-rect", key, from: fromEvent(e), orig: r.slice()});
  });
  CORNERS.forEach(([a, b], c) => {
    const h = handle(r[a], r[b], "h", {kind: "corner", key, a, b});
    h.style.stroke = colour;
  });
  const [lx, ly] = toPx(r[0], r[1]);
  const t = el("text", {x: lx + 6, y: ly + 16, fill: colour, "font-size": 13, "pointer-events": "none"});
  t.textContent = key;
}

// -- pointer ---------------------------------------------------------------
let lastTap = null;      // {i, j, t}: a second tap on the same point removes it

function begin(e, what) {
  if (draft && what.kind !== "draft") return;
  drag = Object.assign(what, {moved: false});
  ed.setPointerCapture(e.pointerId);
  if (what.kind === "insert") {                       // a new point, then drag it
    z.masks[what.i].splice(what.j, 0, fromEvent(e).map(r3));
    drag = {kind: "point", i: what.i, j: what.j, moved: true};
    dirty = true;
    render();
  }
}

ed.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.moved = true;
  const [x, y] = fromEvent(e).map(r3);
  if (drag.kind === "corner") {
    z[drag.key][drag.a] = x; z[drag.key][drag.b] = y;
  } else if (drag.kind === "point") {
    z.masks[drag.i][drag.j] = [x, y];
  } else if (drag.kind === "draft") {
    draft[drag.j] = [x, y];
  } else if (drag.kind === "move-rect") {
    const o = drag.orig, w = o[2] - o[0], h = o[3] - o[1];
    const dx = Math.min(1 - o[2], Math.max(-o[0], x - drag.from[0]));
    const dy = Math.min(1 - o[3], Math.max(-o[1], y - drag.from[1]));
    z[drag.key] = [o[0] + dx, o[1] + dy, o[0] + dx + w, o[1] + dy + h].map(r3);
  } else if (drag.kind === "move-mask") {
    const o = drag.orig;
    const xs = o.map(p => p[0]), ys = o.map(p => p[1]);
    const dx = Math.min(1 - Math.max(...xs), Math.max(-Math.min(...xs), x - drag.from[0]));
    const dy = Math.min(1 - Math.max(...ys), Math.max(-Math.min(...ys), y - drag.from[1]));
    z.masks[drag.i] = o.map(p => [r3(p[0] + dx), r3(p[1] + dy)]);
  }
  dirty = true;
  render();
});

function end() {
  const d = drag;
  drag = null;
  if (!d) return;
  if (d.kind === "corner") { z[d.key] = tidyRect(z[d.key]); render(); }
  if (d.moved) return;
  if (d.kind === "draft" && d.j === 0 && draft.length >= 3) finishDraft();   // closed it
  if (d.kind === "point") {
    const now = Date.now(), m = z.masks[d.i];
    if (lastTap && lastTap.i === d.i && lastTap.j === d.j && now - lastTap.t < 400) {
      lastTap = null;
      if (m.length > 3) { m.splice(d.j, 1); dirty = true; render(); }
      else say("A mask needs at least 3 points: Delete mask removes it.", "err");
      return;
    }
    lastTap = {i: d.i, j: d.j, t: now};
  }
}
ed.addEventListener("pointerup", end);
ed.addEventListener("pointercancel", end);

ed.addEventListener("pointerdown", e => {             // the background
  if (draft) {
    draft.push(fromEvent(e).map(r3));
    dirty = true;
    render();
  } else if (sel >= 0) {
    select(-1);
  }
});

function select(i) { sel = i; render(); }

function finishDraft() {
  if (draft && draft.length >= 3) { z.masks.push(draft); sel = z.masks.length - 1; }
  else if (draft) say("A mask needs at least 3 points: it was dropped.", "err");
  draft = null;
  say(HINT);
  render();
}

// -- buttons and keys ------------------------------------------------------
$("edit").onclick = startEdit;
$("cancel").onclick = () => { stopEdit(); say(""); };
$("save").onclick = save;
$("new-frame").onclick = newFrame;
$("add-mask").onclick = () => {
  if (draft) return finishDraft();
  sel = -1; draft = [];
  say("Click around the decoration, then click the first point (or Finish mask, or Enter). Esc cancels.");
  render();
};
$("del-mask").onclick = () => {
  if (sel < 0) return;
  z.masks.splice(sel, 1); sel = -1; dirty = true; render();
};
$("far").onclick = () => {
  const r = z.roi;
  z.far_roi = z.far_roi ? null : tidyRect([r[0], r[1], r[2], r[1] + (r[3] - r[1]) * 0.4]);
  dirty = true; render();
};
document.addEventListener("keydown", e => {
  if (!z) return;
  if (e.key === "Enter" && draft) finishDraft();
  else if (e.key === "Escape" && draft) { draft = null; say(HINT); render(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && sel >= 0 && !draft) $("del-mask").onclick();
});
window.addEventListener("resize", render);
window.addEventListener("beforeunload", e => { if (z && dirty) e.preventDefault(); });

loadZones();
</script>
</body></html>
