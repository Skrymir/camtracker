# Unraid: Compose Manager plugin, or `docker compose up -d` here.
services:
  camtracker:
    build: .
    image: camtracker
    container_name: camtracker
    restart: unless-stopped
    # The Coral changes its USB ID (and device node) on its first use after
    # power-up, so a --device list made at start goes stale. Instead: the live
    # /dev/bus/usb, and permission for any USB device (char major 189).
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /mnt/user/appdata/camtracker:/config
    # Secrets here (or in Unraid's container settings), never in the repo.
    env_file:
      - /mnt/user/appdata/camtracker/camtracker.env
